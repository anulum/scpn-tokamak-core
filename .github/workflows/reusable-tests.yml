name: Tests

on:
  workflow_call:

permissions: {}

jobs:
  run:
    name: Tests with complete coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12.16"
      - name: Install the hash-locked toolchain, CAD extra and kernel library
        run: python -m pip install --require-hashes -r requirements-cad.txt -r requirements-kernels.txt
      - name: Install the system library the mesher links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglu1-mesa
      - name: Install the package itself (dependencies come from the locks)
        run: python -m pip install --no-deps -e .
      - name: Tests with complete coverage
        run: pytest -q --cov=src --cov=tools --cov-branch --cov-fail-under=100
